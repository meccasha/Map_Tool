name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/atlas-ink-desktop

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check application scripts
        run: npm run check
      - name: Build Windows installer
        run: npm run package:windows
      - name: Upload installer and instructions
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Ink-Windows
          path: |
            release/Atlas Ink Setup *.exe
            README.md
          if-no-files-found: error
          retention-days: 90
